# SANDBOX COPY of .github/workflows/cut-release.yaml. Deliberate differences: the plan
# job installs only Node, and the tag job pushes with its own job token because the
# sandbox has no admin RELEASE_CUT_TOKEN.
# Release on merge: when a promotion (or a releasing hotfix) lands on main with a new package
# version, tag that commit vX.Y.Z. The tag push starts release.yaml and flatpak.yaml, which build
# the draft release; a maintainer reviews the artifacts and clicks Publish.
#
# The version bump was made on staging by `pnpm run promotion:open` and checked before merge by
# the Promotion Doctor and the promotion's release preflight (e2e.yaml), so this workflow only
# decides and tags. Ordinary pushes to main end at the plan job with no approval prompt.
#
# The tag job runs in the protected `release-cut` environment (maintainer approval) and pushes
# with RELEASE_CUT_TOKEN, a PAT (or GitHub App token) owned by a repo **admin** with
# contents:write + workflows:write: only admins may create v* tags (release tags ruleset), and a
# tag pushed with the default GITHUB_TOKEN would not start release.yaml / flatpak.yaml (GitHub
# recursion guard). That job runs no Node and installs nothing.
#
# Manual dispatch on main re-checks the current main commit, for example after a declined
# approval.

name: Cut release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_tag: ${{ steps.plan.outputs.should_tag }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout main
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          # Release tags are needed to find the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Decide whether this commit releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-plan.mjs --sha "$GITHUB_SHA"

  tag:
    name: Tag release
    needs: plan
    if: needs.plan.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    environment: release-cut
    permissions:
      contents: write
    steps:
      - name: Checkout main
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}

      # --cleanup=verbatim keeps the notes' markdown headings, which git's default cleanup
      # strips as comments. release.yaml copies this message into the draft release body.
      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "${RELEASE_NOTES}" > "${notes_file}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" --cleanup=verbatim -F "${notes_file}" "${GITHUB_SHA}"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: git push origin "refs/tags/${RELEASE_TAG}"
